<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Warehouse Scanner</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 750px;
      margin: 30px auto;
      background-color: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 22px;
      margin-bottom: 30px;
    }

    #startButton {
      padding: 20px 40px;
      font-size: 28px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background-color: #222;
      color: white;
      cursor: pointer;
      margin-bottom: 25px;
    }

    #startButton:active {
      transform: scale(0.98);
    }

    #status {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    #barcodeInput {
      position: absolute;
      left: -9999px;
      opacity: 0;
    }

    #result {
      margin-top: 25px;
      padding: 30px;
      min-height: 220px;
      border-radius: 15px;
      background-color: #eeeeee;
    }

    #result h2 {
      font-size: 36px;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    #result p {
      font-size: 26px;
      margin: 10px 0;
    }

    #result h1 {
      font-size: 85px;
      margin: 15px 0;
    }

    .ready {
      font-size: 34px;
      font-weight: bold;
      margin-top: 70px;
    }

  </style>
</head>


<body>

  <div class="container">

    <h1>Warehouse Scanner</h1>

    <div class="subtitle">
      Scan a product barcode to find its location
    </div>


    <button id="startButton">
      Start Scanning
    </button>


    <div id="status">
      Scanner Not Started
    </div>


    <!--
      Hidden textbox.

      The Tera scanner acts like a keyboard and types
      the barcode into this input.
    -->

    <input
      type="text"
      id="barcodeInput"
      autocomplete="off"
      inputmode="none"
    >


    <div id="result">

      <div class="ready">
        Press Start Scanning
      </div>

    </div>

  </div>


  <script src="script.js"></script>

</body>

</html>
