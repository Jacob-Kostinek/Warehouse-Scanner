<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Warehouse Scanner</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 750px;
      margin: 30px auto;
      background-color: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 22px;
      margin-bottom: 30px;
    }

    #startButton {
      padding: 20px 40px;
      font-size: 28px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background-color: #222;
      color: white;
      margin-bottom: 25px;
    }

    #status {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    #barcodeInput {
      width: 1px;
      height: 1px;
      position: absolute;
      left: -1000px;
    }

    #result {
      margin-top: 25px;
      padding: 30px;
      min-height: 220px;
      border-radius: 15px;
      background-color: #eeeeee;
    }

    #result h2 {
      font-size: 36px;
      margin-bottom: 20px;
    }

    #result p {
      font-size: 26px;
    }

    #result .location {
      font-size: 90px;
      font-weight: bold;
      margin: 20px;
    }

    .ready {
      font-size: 34px;
      font-weight: bold;
      margin-top: 70px;
    }
  </style>

</head>

<body>

  <div class="container">

    <h1>Warehouse Scanner</h1>

    <div class="subtitle">
      Scan a product barcode to find its location
    </div>

    <button id="startButton">
      Start Scanning
    </button>

    <div id="status">
      Scanner Not Started
    </div>

    <input
      type="text"
      id="barcodeInput"
      autocomplete="off"
    >

    <div id="result">

      <div class="ready">
        Press Start Scanning
      </div>

    </div>

  </div>


  <script>

    let products = [];
    let scanningEnabled = false;
    let scanTimer;

    const startButton =
      document.getElementById("startButton");

    const barcodeInput =
      document.getElementById("barcodeInput");

    const status =
      document.getElementById("status");

    const result =
      document.getElementById("result");


    // Load products.json
    fetch("products.json")
      .then(function(response) {
        return response.json();
      })
      .then(function(data) {

        products = data;

        console.log("Products loaded");

      })
      .catch(function(error) {

        console.log("Could not load products.json");

        status.innerHTML =
          "Error Loading Products";

      });


    // START SCANNING BUTTON
    startButton.addEventListener("click", function() {

      scanningEnabled = true;

      startButton.innerHTML =
        "Scanning Active";

      status.innerHTML =
        "Scanner Ready";

      result.innerHTML =
        '<div class="ready">Ready to Scan...</div>';

      barcodeInput.value = "";

      barcodeInput.focus();

    });


    // Detect scanner typing
    barcodeInput.addEventListener("input", function() {

      if (scanningEnabled === false) {
        return;
      }

      clearTimeout(scanTimer);

      scanTimer = setTimeout(function() {

        let barcode =
          barcodeInput.value.trim();

        if (barcode.length > 0) {

          findProduct(barcode);

          barcodeInput.value = "";

          barcodeInput.focus();

        }

      }, 200);

    });


    // Also support scanner sending ENTER
    barcodeInput.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {

        clearTimeout(scanTimer);

        let barcode =
          barcodeInput.value.trim();

        if (barcode.length > 0) {

          findProduct(barcode);

        }

        barcodeInput.value = "";

        barcodeInput.focus();

      }

    });


    function findProduct(barcode) {

      let product = products.find(function(p) {

        return p.barcode.toString().trim()
          === barcode;

      });


      if (product) {

        result.innerHTML =
          "<h2>" + product.item + "</h2>" +
          "<p>PUT IN:</p>" +
          '<div class="location">' +
          product.location +
          "</div>" +
          "<p>Barcode: " +
          barcode +
          "</p>";

      }

      else {

        result.innerHTML =
          "<h2>Unknown Barcode</h2>" +
          "<p>" +
          barcode +
          "</p>";

      }

      barcodeInput.focus();

    }

  </script>

</body>

</html>
